services:
  phoenix:
    image: arizephoenix/phoenix:version-20.11.0
    ports:
      - "127.0.0.1:6006:6006"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/readyz', timeout=3).close()"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  phoenix_data:
